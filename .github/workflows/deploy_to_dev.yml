name: Deploy Dev

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  DeployInfra:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Repo Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          set-safe-directory: false

      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy to Environment
        working-directory: infra
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
        run: |
          cdk deploy --all --require-approval never

  CompileAndDeploy:
    needs: [DeployInfra]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Repo Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          set-safe-directory: false

      - name: Node setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Dependencies
        working-directory: website
        run: npm ci

      - name: Build Website
        working-directory: website
        run: |
          npm run build

      - name: Get Bucket name And CloudFront Dist Id
        id: resources-values
        working-directory: website
        run: |
          BUCKETNAME=$(aws cloudformation describe-stacks \
            --stack-name InfraStack \
            --query 'Stacks[0].Outputs[?OutputKey==`websiteBucketName`].OutputValue' \
            --output text \
            --region ${{ secrets.AWS_REGION }})

          CLOUDFRONTID=$(aws cloudformation describe-stacks \
            --stack-name InfraStack \
            --query 'Stacks[0].Outputs[?OutputKey==`cloudFrontDistId`].OutputValue' \
            --output text \
            --region ${{ secrets.AWS_REGION }})

          echo "bucket=$BUCKETNAME" >> $GITHUB_OUTPUT
          echo "cloudfront=$CLOUDFRONTID" >> $GITHUB_OUTPUT

      - name: Upload files to bucket
        working-directory: website
        run: |
          aws s3 sync ./dist s3://${{ steps.resources-values.outputs.bucket }}

      - name: Invalidate Cloudfront
        working-directory: website
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ steps.resources-values.outputs.cloudfront }} \
          --paths "/index.html"
